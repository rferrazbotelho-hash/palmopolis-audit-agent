[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
markers =
    licitacoes: Testes de reconciliação de licitações (Arts. 54 e 94)
    contratos: Testes de reconciliação e tempestividade de contratos (Art. 94)
    dispensas: Testes de limites de dispensa e fracionamento (Art. 75)
    fornecedores: Testes de curva ABC e vínculos com servidores (Arts. 9º e 14)
    lai: Testes de transparência ativa (Lei 12.527/2011)
    relatorios: Testes de geração de Excel e HTML
